name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - run: go mod download
      - name: Format check
        run: |
          output=$(gofmt -s -l -e .)
          if [ -n "$output" ]; then
            echo "Unformatted files found:"
            echo "$output"
            exit 1
          fi
      - parallel:
          - name: Lint
            uses: golangci/golangci-lint-action@v9
            with:
              version: latest
              only-new-issues: true
          - name: Test (unit + mock acceptance)
            run: TF_ACC=1 go test ./...
            env:
              TF_ACC: "1"
          - name: Build
            run: CGO_ENABLED=0 go build -o ./build/terraform-provider-clickup .
