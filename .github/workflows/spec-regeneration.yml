name: Weekly ClickUp spec regeneration

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate provider from OpenAPI spec
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Download latest ClickUp OpenAPI spec
        run: curl -L -o ClickUp_PUBLIC_API_V2.json https://developer.clickup.com/openapi/ClickUp_PUBLIC_API_V2.json

      - name: Regenerate provider code
        # Single source of truth: same pipeline as `mise run generate` locally.
        # If this drifts, fix mise.toml, not this workflow.
        run: mise run generate

      - name: Regenerate registry docs
        run: mise run docs

      - name: Build and test
        run: |
          go build ./...
          go test ./...

      - name: Create pull request if changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/spec-regeneration
          title: 'chore: regenerate provider from latest ClickUp OpenAPI spec'
          body: |
            Automated weekly regeneration of the provider code from the latest
            ClickUp Public API V2 OpenAPI specification via `mise run generate`.
          commit-message: 'chore: regenerate provider from latest ClickUp OpenAPI spec'
