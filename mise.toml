[tools]
go = "1.26.5"
terraform = "1.15.8"
golangci-lint = "2.12.2"
lefthook = "2.1.10"
"ubi:goreleaser/goreleaser" = "2.17.1"
"go:github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs" = "v0.25.0"
"go:github.com/hashicorp/terraform-plugin-codegen-openapi/cmd/tfplugingen-openapi" = "v0.3.0"
"go:github.com/hashicorp/terraform-plugin-codegen-framework/cmd/tfplugingen-framework" = "v0.4.1"

[hooks]
postinstall = "lefthook install"

[tasks.build]
description = "Build the provider"
run = "go build -v ./..."

[tasks.install]
description = "Install the provider binary"
depends = ["build"]
run = "go install -v ./..."

[tasks.test]
description = "Run unit tests"
usage = 'arg "<pkg>" default="./..."'
run = "go test -v -cover -timeout=120s -parallel=10 ${usage_pkg?}"

[tasks.testacc]
description = "Run acceptance tests with TF_ACC=1"
usage = 'arg "<pkg>" default="./..."'
env = { TF_ACC = "1" }
run = "go test -v -race -cover -timeout=120m -parallel=10 ${usage_pkg?}"

[tasks.fmt]
description = "Format Go source files"
run = "gofmt -s -w -e ."

[tasks.fmt-check]
description = "Check Go formatting"
run = "gofmt -s -l -e ."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.generate]
description = "Generate provider code from the ClickUp OpenAPI spec"
run = [
  "python3 tools/prepare_openapi_spec.py ClickUp_PUBLIC_API_V2.json ClickUp_PUBLIC_API_V2.prepared.json",
  "python3 tools/generate_config.py ClickUp_PUBLIC_API_V2.prepared.json generator_config.yml ClickUp_PUBLIC_API_V2.prepared.merged.json",
  "tfplugingen-openapi generate --config generator_config.yml --output provider_code_spec.json ClickUp_PUBLIC_API_V2.prepared.merged.json",
  "python3 tools/patch_code_spec.py provider_code_spec.json",
  "tfplugingen-framework generate all --input provider_code_spec.json --output internal/provider/generated",
  "python3 tools/generate_provider.py generator_config.yml ClickUp_PUBLIC_API_V2.prepared.json",
  "gofmt -w .",
]

[tasks.docs]
description = "Generate Terraform Registry docs from the ClickUp OpenAPI spec"
run = ["tfplugindocs generate"]

[tasks.default]
description = "Default local development check"
run = [
  { task = "fmt" },
  { task = "build" },
  { task = "test" },
  { task = "lint" },
]
